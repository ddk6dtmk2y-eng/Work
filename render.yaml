services:
  - type: web
    name: hostflow-crm
    runtime: node
    plan: starter
    region: frankfurt
    numInstances: 1
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data/hostflow
      - key: OWNER_EMAIL
        sync: false
      - key: REGISTRATION_KEY
        generateValue: true
    disk:
      name: hostflow-data
      mountPath: /var/data
      sizeGB: 1
